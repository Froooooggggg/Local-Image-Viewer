org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# === Kotlin 增量编译（在本机 Windows 上必须关闭）===
# 症状：构建报
#   Could not close incremental caches ...
#   class-fq-name-to-source.tab, source-to-classes.tab, internal-name-to-source.tab
# 原因：Kotlin 守护进程以内存映射方式持有这些 .tab 缓存文件，退出时无法关闭，
#       与本项目代码无关（删掉缓存目录后依旧复现）。
# 取舍：关闭增量编译后每次全量编译 Kotlin 插件，构建稍慢但稳定可靠。
kotlin.incremental=false
# 在 Gradle 自身进程内执行编译，不再派生独立的 Kotlin 守护进程，
# 从根源上避免上述文件句柄问题。
kotlin.compiler.execution.strategy=in-process

# === 代理开关（默认关闭）===
# 曾经必须启用：镜像只覆盖 Maven 仓库，Gradle 自身的非 Maven 请求
# （插件门户、发行版校验等）会打向被墙域名并挂起。
# 但现在 Gradle 发行版已走腾讯云镜像、Maven 走阿里云镜像，且依赖已全部
# 缓存，因此默认关闭代理；否则代理未运行时 Gradle 会因连不上
# 127.0.0.1:5188 而直接失败。
# 若日后构建再次卡在「连接已建立但零响应」，把下面 4 行取消注释即可。
# systemProp.http.proxyHost=127.0.0.1
# systemProp.http.proxyPort=5188
# systemProp.https.proxyHost=127.0.0.1
# systemProp.https.proxyPort=5188
# 不代理本机回环，避免 Gradle 守护进程间通信被绕路
systemProp.http.nonProxyHosts=localhost|127.0.0.1|*.local
systemProp.https.nonProxyHosts=localhost|127.0.0.1|*.local
